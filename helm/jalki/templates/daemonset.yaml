apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jalki
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jalki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jalki
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      hostPID: true
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: jalki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          args:
            - --emit
            - {{ .Values.emit | quote }}
            {{- if .Values.cluster }}
            - --cluster
            - {{ .Values.cluster | quote }}
            {{- end }}
          env:
            - name: RUST_LOG
              value: "jalki=info"
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
            {{- end }}
          # Liveness answers /healthz, which consults NOTHING — not the sink,
          # not the retry buffer. That separation is the point (jalki #42;
          # vartio ADR-0009 explicitly rejects sink-health-fed liveness): a
          # liveness probe that fails during a Vartio outage tells the kubelet
          # to restart the agent, destroying the buffered evidence the outage
          # is exactly when we need, and turning one incident into a crash
          # loop. Do not repoint this at /readyz or /metrics.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
          # Readiness reports whether evidence is *flowing*: it goes red once
          # the agent has held undeliverable evidence longer than
          # JALKI_READY_MAX_BACKLOG_AGE_SECS (default 60). Nothing selects this
          # DaemonSet, so NotReady cuts no traffic — it is a visible, alertable
          # state instead of a restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: btf
          hostPath:
            path: /sys/kernel/btf
