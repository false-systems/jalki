apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jalki
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jalki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jalki
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostPID for process/cgroup visibility; hostNetwork so the pod hostname
      # is the node name and the kernel netns matches the host.
      hostPID: true
      hostNetwork: true
      # REQUIRED with hostNetwork. Without it the pod inherits the host's
      # resolver and cluster DNS names do not resolve — so a vartio endpoint
      # like vartio.vartio.svc.cluster.local silently fails to connect.
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: jalki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # privileged for eBPF load + attach. runAsUser 0 is not redundant:
          # the image base is distroless :nonroot, so without it the process
          # keeps uid 65532 and its effective capabilities are cleared at exec —
          # BPF map creation then fails EPERM even inside a privileged pod.
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          args:
            - --sink
            - {{ .Values.sink | quote }}
            {{- if .Values.k8sEnrichment }}
            - --k8s-enrichment
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.cluster }}
            - name: JALKI_CLUSTER
              value: {{ .Values.cluster | quote }}
            {{- end }}
            {{- if eq .Values.sink "vartio" }}
            {{- if not .Values.vartio.endpoint }}
            {{- fail "sink=vartio requires vartio.endpoint" }}
            {{- end }}
            - name: JALKI_VARTIO_ENDPOINT
              value: {{ .Values.vartio.endpoint | quote }}
            - name: JALKI_VARTIO_ADAPTER_ID
              value: {{ .Values.vartio.adapterId | quote }}
            - name: JALKI_VARTIO_FILE_TYPES
              value: {{ ternary "1" "0" .Values.vartio.fileTypes | quote }}
            - name: VARTIO_INGRESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vartio.ingressTokenSecret.name | quote }}
                  key: {{ .Values.vartio.ingressTokenSecret.key | quote }}
            {{- end }}
            {{- with .Values.namespaces }}
            - name: JALKI_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.k8sEnrichment }}
            - name: JALKI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            - name: JALKI_RETRY_MAX_BYTES
              value: {{ .Values.retry.maxBytes | int64 | quote }}
            - name: JALKI_RETRY_MAX_RECORDS
              value: {{ .Values.retry.maxRecords | int64 | quote }}
            {{- with .Values.retry.maxAgeMs }}
            - name: JALKI_RETRY_MAX_AGE_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.retry.backoffBaseMs }}
            - name: JALKI_RETRY_BACKOFF_BASE_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.retry.backoffMaxMs }}
            - name: JALKI_RETRY_BACKOFF_MAX_MS
              value: {{ . | quote }}
            {{- end }}
            - name: JALKI_READY_MAX_BACKLOG_AGE_SECS
              value: {{ .Values.readiness.maxBacklogAgeSeconds | int64 | quote }}
            # Self-shedding needs this agent's own memory limit, and it cannot
            # read it from the cgroup: the DaemonSet bind-mounts the *host's*
            # /sys/fs/cgroup, so the resolvable limit is the node root's, which
            # is unbounded. Without this the feature stays off — safely, and
            # loudly, but off. See jalki #33.
            - name: JALKI_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: jalki
                  resource: limits.memory
            {{- with .Values.memory.highWatermark }}
            - name: JALKI_MEMORY_HIGH_WATERMARK
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.spool.enabled }}
            # Undelivered evidence is mirrored here, so a restart during a sink
            # outage does not destroy exactly the evidence that outage produced.
            - name: JALKI_SPOOL_PATH
              value: {{ printf "%s/backlog.spool" .Values.spool.mountPath | quote }}
            - name: JALKI_SPOOL_MAX_BYTES
              value: {{ .Values.spool.maxBytes | int64 | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
            {{- end }}
          # Liveness answers /healthz, which consults NOTHING — not the sink,
          # not the retry buffer. That separation is the point (jalki #42;
          # vartio ADR-0009 explicitly rejects sink-health-fed liveness): a
          # liveness probe that fails during a Vartio outage tells the kubelet
          # to restart the agent, destroying the buffered evidence the outage
          # is exactly when we need, and turning one incident into a crash
          # loop. Do not repoint this at /readyz or /metrics.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
          # Readiness reports whether evidence is *flowing*: it goes red once
          # the agent has held undeliverable evidence longer than
          # JALKI_READY_MAX_BACKLOG_AGE_SECS (default 60). Nothing selects this
          # DaemonSet, so NotReady cuts no traffic — it is a visible, alertable
          # state instead of a restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            {{- if .Values.k8sEnrichment }}
            # cgroup_id → container resolution. Without this the enricher
            # cannot bind evidence to a pod and every record ships unbound.
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
              readOnly: true
            {{- end }}
            {{- if .Values.spool.enabled }}
            - name: spool
              mountPath: {{ .Values.spool.mountPath | quote }}
            {{- end }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        {{- if .Values.k8sEnrichment }}
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
        {{- end }}
        {{- if .Values.spool.enabled }}
        # emptyDir, not hostPath: it survives a container restart — including
        # an OOM kill, the case this exists for — and is cleaned up when the
        # pod goes, so a drained node leaves no orphaned evidence behind.
        # Surviving a *reschedule* would need hostPath and an eviction story
        # for stale spools; that trade has not been made.
        - name: spool
          emptyDir:
            sizeLimit: {{ .Values.spool.sizeLimit | quote }}
        {{- end }}
