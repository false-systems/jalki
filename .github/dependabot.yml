version: 2
updates:
  # Base images in the Dockerfile are pinned by tag plus digest; this proposes
  # the digest refreshes (base-images' weekly rebuild, distroless security
  # rebuilds) as one grouped weekly PR.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "03:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    ignore:
      # The Rust version is pinned on purpose: 1.97.1, the fix release for
      # the 1.97.0 x86_64 miscompile (rust-lang/rust#159035). It moves only
      # together with rust-toolchain.toml, in one deliberate PR, never by
      # drift. Same-tag digest refreshes (the weekly base-images rebuild)
      # stay eligible; this covers both the plain and the -ebpf tag.
      #
      # Dependabot names a docker dependency WITHOUT its registry: the FROM
      # ghcr.io/false-systems/rust-builder lines are the dependency
      # "false-systems/rust-builder", so a "ghcr.io/..." name here matches
      # nothing and the rule is silently dead. The leading * matches the name
      # with or without a registry.
      - dependency-name: "*false-systems/rust-builder"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        patterns: ["*"]
