name: Container

# Builds AND publishes the jälki image (daemon + MCP + eBPF object) to GHCR on
# every push to main and on tags — it is the image the false-infra DaemonSet
# deploys, so it must track main. Per-PR smoke builds run only when something
# that actually changes the image changes; jälki has no other CI, so this is
# also the only automated build gate the repo has (the local
# fmt/clippy/test gate remains the review bar).
#
# MULTI-ARCH (2026-08-15): built per-arch natively and merged into one
# manifest list, the same pattern as false-infra's runner-image.yml. The
# reference manifest has always claimed "images are published for arm64 and
# amd64"; until the first amd64 deployer (the i-tutor VM) tried it, that
# claim was fiction — :main was arm64-only and an amd64 kubelet failed with
# "no match for platform in manifest". Per-arch tags use --provenance=false:
# BuildKit provenance turns a single-arch push into an OCI index and the
# imagetools merge then refuses it (learned on runner-image.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"
      - "jalki-ebpf/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/false-systems/jalki

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (+ push per-arch on main/tags)
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    # Every build is GitHub-hosted now, on both arches — the arc pools retire
    # with the false-infra cluster. This drops the event-based split that kept
    # fork-controlled pull_request code off our infra: with nothing self-hosted
    # left, that property holds by construction instead of by conditional.
    # Native per-arch runners are still the point — the eBPF object
    # (bpfel-unknown-none) is arch-independent bytecode, but the daemon binary
    # is per-arch and builds natively on each runner. No qemu, no cross.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push per-arch tag on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          # Per-arch tags are addressed by COMMIT, never by branch: the merge
          # job below is the only writer of mutable tags. sha-<short>-<arch>
          # is immutable, so a stale re-run can only rewrite its own commit's
          # arch tag — harmless by construction.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    name: Merge manifest (+ publish tags)
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check this commit is still the tip of main
        # A re-run of an old push build keeps its original github.sha, so
        # without this guard it re-publishes :main from that stale commit and
        # silently rolls the deployed tag back (issue #36: two re-runs of the
        # d4cb486 build overwrote the c6f0667 image hours after it shipped).
        # Stale builds keep their immutable sha tag; only the mutable branch
        # tag is gated. This also covers out-of-order queued builds racing a
        # newer push.
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "is_tip=$([ "$tip" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          arm="${IMAGE}:sha-${GITHUB_SHA}-arm64"
          amd="${IMAGE}:sha-${GITHUB_SHA}-amd64"
          short="${GITHUB_SHA::7}"

          # Immutable multi-arch sha tag: always, stale or not.
          docker buildx imagetools create -t "${IMAGE}:sha-${short}" "$arm" "$amd"

          # Mutable branch tag: tip-gated (see the guard above).
          if [ "${{ steps.tip.outputs.is_tip }}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create -t "${IMAGE}:main" "$arm" "$amd"
          else
            echo "::notice::not the tip of main (or not a branch push) — skipping the mutable :main tag"
          fi

          # Semver tags for releases.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              docker buildx imagetools create -t "${IMAGE}:${version}" "$arm" "$amd"
              ;;
          esac

          echo "── published manifests ──"
          docker buildx imagetools inspect "${IMAGE}:sha-${short}" | head -20
