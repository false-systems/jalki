[package]
name = "jalki-vartio-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Plane-B transport: an `EvidenceSink` that delivers jälki evidence to
# Vartio's `SourceIngress.ReceiveBatch` (ADR-0003). aya-free — builds and tests
# everywhere jalki-evidence does.

[dependencies]
jalki-evidence = { path = "../jalki-evidence" }
false-protocol = { workspace = true }

# gRPC stack — pinned to the combination the vendored codegen was generated and
# tested with (0.14.6 raises MSRV).
# tls-ring: rustls with the ring provider — the daemon already installs ring
# as the process-default crypto provider (see jalki main.rs). native-roots so
# an https:// endpoint validates against the platform trust store (Let's
# Encrypt certs included) with no bundled CA file.
tonic = { version = "=0.14.5", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "=0.14.5"
prost = "0.14"
prost-types = "0.14"

async-trait = "0.1"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = "=0.14.5"
